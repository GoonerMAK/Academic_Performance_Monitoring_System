version: "3.9"

services: 
  postgres:
    image: postgres:alpine3.20
    container_name: performance-monitor-postgres 
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "MAK#9555"
      POSTGRES_DB: "academic_performance_monitoring_system"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: